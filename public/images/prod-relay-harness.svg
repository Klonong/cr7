<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="studio" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#studio)"/>
  <ellipse cx="300" cy="490" rx="185" ry="20" fill="#09090b" opacity="0.12"/>

  <!-- Coiled Braided Harness -->
  <ellipse cx="300" cy="315" rx="158" ry="118" stroke="#18181b" stroke-width="24" fill="none"/>
  <ellipse cx="300" cy="315" rx="158" ry="118" stroke="#3f3f46" stroke-width="8" stroke-dasharray="10 8" fill="none"/>

  <!-- Sealed 40A Relay Box -->
  <rect x="236" y="138" width="128" height="128" rx="14" fill="#18181b" stroke="#52525b" stroke-width="3"/>
  <rect x="252" y="154" width="96" height="96" rx="8" fill="#09090b" stroke="#27272a" stroke-width="2"/>
  <rect x="274" y="114" width="52" height="26" rx="6" fill="#27272a" stroke="#52525b" stroke-width="2"/>
  <circle cx="300" cy="126" r="6" fill="#e4e4e7"/>
  <text x="300" y="198" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#fafafa">12V 40A</text>
  <text x="300" y="220" text-anchor="middle" font-family="monospace" font-size="12" fill="#ef4444">WATERPROOF</text>

  <!-- Inline Fuse Block -->
  <rect x="128" y="330" width="96" height="44" rx="8" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  <rect x="148" y="340" width="56" height="24" rx="4" fill="#18181b"/>
  <text x="176" y="356" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#fef08a">30A FUSE</text>

  <!-- Waterproof Deutsch Connectors -->
  <rect x="378" y="326" width="94" height="48" rx="8" fill="#27272a" stroke="#52525b" stroke-width="2"/>
  <rect x="390" y="338" width="18" height="24" rx="3" fill="#f59e0b"/>
  <rect x="442" y="336" width="22" height="28" rx="4" fill="#18181b" stroke="#71717a" stroke-width="1.5"/>

  <!-- Battery Ring Terminals -->
  <circle cx="238" cy="442" r="18" fill="#dc2626"/>
  <circle cx="238" cy="442" r="8" fill="#e4e4e7"/>
  <circle cx="362" cy="442" r="18" fill="#18181b" stroke="#52525b" stroke-width="2"/>
  <circle cx="362" cy="442" r="8" fill="#e4e4e7"/>
</svg>
