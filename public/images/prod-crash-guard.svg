<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="studio" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </radialGradient>
    <linearGradient id="delrin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="redRing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4e4e7"/>
      <stop offset="50%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#studio)"/>
  <ellipse cx="300" cy="488" rx="185" ry="20" fill="#09090b" opacity="0.12"/>

  <!-- Left Frame Slider -->
  <g transform="translate(0, -35)">
    <!-- Mounting Bolt -->
    <rect x="96" y="218" width="90" height="24" rx="4" fill="url(#steel)" stroke="#52525b" stroke-width="1.5"/>
    <g stroke="#52525b" stroke-width="2">
      <line x1="110" y1="218" x2="110" y2="242"/>
      <line x1="122" y1="218" x2="122" y2="242"/>
      <line x1="134" y1="218" x2="134" y2="242"/>
      <line x1="146" y1="218" x2="146" y2="242"/>
    </g>
    <!-- Alloy Collar -->
    <rect x="186" y="196" width="64" height="68" rx="10" fill="#27272a" stroke="#52525b" stroke-width="2"/>
    <!-- Red Anodized CNC Ring -->
    <rect x="250" y="190" width="24" height="80" rx="4" fill="url(#redRing)"/>
    <!-- Delrin Slider Puck -->
    <rect x="274" y="182" width="186" height="96" rx="18" fill="url(#delrin)" stroke="#52525b" stroke-width="2.5"/>
    <rect x="460" y="196" width="22" height="68" rx="8" fill="url(#redRing)"/>
    <line x1="305" y1="210" x2="430" y2="210" stroke="#52525b" stroke-width="2" opacity="0.5"/>
    <line x1="305" y1="250" x2="430" y2="250" stroke="#52525b" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Right Frame Slider -->
  <g transform="translate(0, 128)">
    <rect x="414" y="218" width="90" height="24" rx="4" fill="url(#steel)" stroke="#52525b" stroke-width="1.5"/>
    <g stroke="#52525b" stroke-width="2">
      <line x1="454" y1="218" x2="454" y2="242"/>
      <line x1="466" y1="218" x2="466" y2="242"/>
      <line x1="478" y1="218" x2="478" y2="242"/>
      <line x1="490" y1="218" x2="490" y2="242"/>
    </g>
    <rect x="350" y="196" width="64" height="68" rx="10" fill="#27272a" stroke="#52525b" stroke-width="2"/>
    <rect x="326" y="190" width="24" height="80" rx="4" fill="url(#redRing)"/>
    <rect x="140" y="182" width="186" height="96" rx="18" fill="url(#delrin)" stroke="#52525b" stroke-width="2.5"/>
    <rect x="118" y="196" width="22" height="68" rx="8" fill="url(#redRing)"/>
    <line x1="170" y1="210" x2="295" y2="210" stroke="#52525b" stroke-width="2" opacity="0.5"/>
    <line x1="170" y1="250" x2="295" y2="250" stroke="#52525b" stroke-width="2" opacity="0.5"/>
  </g>
</svg>
