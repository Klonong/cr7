<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="studio" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </radialGradient>
    <linearGradient id="blueGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="cnc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#studio)"/>
  <ellipse cx="300" cy="492" rx="185" ry="20" fill="#09090b" opacity="0.12"/>

  <!-- Left Bar-End Mirror -->
  <g>
    <!-- Bar Clamp -->
    <circle cx="155" cy="402" r="36" fill="url(#cnc)" stroke="#52525b" stroke-width="2.5"/>
    <circle cx="155" cy="402" r="18" fill="#e4e4e7"/>
    <!-- Stem -->
    <path d="M158 366 L195 256 L225 266 L186 376 Z" fill="#18181b" stroke="#52525b" stroke-width="2"/>
    <!-- Angular Mirror Head -->
    <polygon points="105,212 248,142 325,182 285,265 135,272" fill="url(#cnc)" stroke="#52525b" stroke-width="3"/>
    <polygon points="124,218 245,158 306,188 272,252 146,258" fill="url(#blueGlass)"/>
    <line x1="158" y1="242" x2="262" y2="176" stroke="#ffffff" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Right Bar-End Mirror -->
  <g>
    <circle cx="445" cy="402" r="36" fill="url(#cnc)" stroke="#52525b" stroke-width="2.5"/>
    <circle cx="445" cy="402" r="18" fill="#e4e4e7"/>
    <path d="M442 366 L405 256 L375 266 L414 376 Z" fill="#18181b" stroke="#52525b" stroke-width="2"/>
    <polygon points="495,212 352,142 275,182 315,265 465,272" fill="url(#cnc)" stroke="#52525b" stroke-width="3"/>
    <polygon points="476,218 355,158 294,188 328,252 454,258" fill="url(#blueGlass)"/>
    <line x1="442" y1="242" x2="338" y2="176" stroke="#ffffff" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
