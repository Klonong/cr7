<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="studio" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </radialGradient>
    <linearGradient id="metal" x1="140" y1="150" x2="460" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="optic" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#bae6fd"/>
      <stop offset="76%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <radialGradient id="opticAmber" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#studio)"/>
  <ellipse cx="300" cy="482" rx="185" ry="22" fill="#09090b" opacity="0.14"/>

  <!-- Bracket -->
  <path d="M240 375 L220 462 L380 462 L360 375 Z" fill="#27272a" stroke="#52525b" stroke-width="2"/>
  <rect x="200" y="454" width="200" height="20" rx="5" fill="#18181b" stroke="#52525b" stroke-width="2"/>
  <circle cx="232" cy="464" r="5" fill="#71717a"/>
  <circle cx="368" cy="464" r="5" fill="#71717a"/>

  <!-- SQL 3-Eye Body -->
  <rect x="108" y="196" width="384" height="184" rx="26" fill="url(#metal)" stroke="#52525b" stroke-width="3"/>
  <!-- Top Cooling Fins -->
  <g stroke="#52525b" stroke-width="5" stroke-linecap="round">
    <line x1="150" y1="184" x2="150" y2="198"/>
    <line x1="180" y1="184" x2="180" y2="198"/>
    <line x1="210" y1="184" x2="210" y2="198"/>
    <line x1="240" y1="184" x2="240" y2="198"/>
    <line x1="270" y1="184" x2="270" y2="198"/>
    <line x1="300" y1="184" x2="300" y2="198"/>
    <line x1="330" y1="184" x2="330" y2="198"/>
    <line x1="360" y1="184" x2="360" y2="198"/>
    <line x1="390" y1="184" x2="390" y2="198"/>
    <line x1="420" y1="184" x2="420" y2="198"/>
    <line x1="450" y1="184" x2="450" y2="198"/>
  </g>
  <!-- Red Accent Frame -->
  <rect x="122" y="210" width="356" height="156" rx="20" fill="#0f0f12" stroke="#dc2626" stroke-width="3"/>

  <!-- 3 Projector Eyes -->
  <g>
    <circle cx="192" cy="288" r="48" fill="#18181b" stroke="#71717a" stroke-width="4"/>
    <circle cx="192" cy="288" r="36" fill="url(#optic)"/>
    <circle cx="180" cy="276" r="9" fill="#ffffff" opacity="0.85"/>

    <circle cx="300" cy="288" r="48" fill="#18181b" stroke="#71717a" stroke-width="4"/>
    <circle cx="300" cy="288" r="36" fill="url(#opticAmber)"/>
    <circle cx="288" cy="276" r="9" fill="#ffffff" opacity="0.85"/>

    <circle cx="408" cy="288" r="48" fill="#18181b" stroke="#71717a" stroke-width="4"/>
    <circle cx="408" cy="288" r="36" fill="url(#optic)"/>
    <circle cx="396" cy="276" r="9" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Corner Hex Bolts -->
  <circle cx="138" cy="226" r="5" fill="#71717a"/>
  <circle cx="462" cy="226" r="5" fill="#71717a"/>
  <circle cx="138" cy="350" r="5" fill="#71717a"/>
  <circle cx="462" cy="350" r="5" fill="#71717a"/>
</svg>
