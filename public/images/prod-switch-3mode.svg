<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="studio" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </radialGradient>
    <linearGradient id="housing" x1="160" y1="120" x2="440" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#studio)"/>
  <ellipse cx="300" cy="494" rx="150" ry="18" fill="#09090b" opacity="0.14"/>

  <!-- Handlebar Clamp Ring -->
  <rect x="215" y="128" width="170" height="320" rx="34" fill="url(#housing)" stroke="#52525b" stroke-width="3"/>

  <!-- Mode 1 Red Rocker Button -->
  <rect x="250" y="170" width="100" height="62" rx="12" fill="#dc2626" stroke="#991b1b" stroke-width="2.5"/>
  <circle cx="300" cy="201" r="10" fill="none" stroke="#ffffff" stroke-width="3"/>
  <line x1="300" y1="186" x2="300" y2="196" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Mode 2 Hi/Lo Toggle -->
  <rect x="250" y="254" width="100" height="68" rx="12" fill="#27272a" stroke="#52525b" stroke-width="2.5"/>
  <text x="300" y="282" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#e0f2fe">HI · 6000K</text>
  <line x1="266" y1="290" x2="334" y2="290" stroke="#52525b" stroke-width="1.5"/>
  <text x="300" y="308" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">LO · 3000K</text>

  <!-- Pass Beam Flash Button -->
  <rect x="250" y="346" width="100" height="58" rx="12" fill="#f59e0b" stroke="#b45309" stroke-width="2.5"/>
  <text x="300" y="381" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#09090b">PASS</text>

  <!-- Cable Exit -->
  <path d="M300 448 L300 492 C300 508, 330 515, 368 515" stroke="#18181b" stroke-width="14" stroke-linecap="round" fill="none"/>
</svg>
