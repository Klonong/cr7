<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="studio" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </radialGradient>
    <linearGradient id="cncBlack" x1="120" y1="150" x2="480" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="45%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="cncRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#studio)"/>
  <ellipse cx="300" cy="485" rx="190" ry="20" fill="#09090b" opacity="0.12"/>

  <!-- Upper Lever (Brake) -->
  <g transform="rotate(-12 300 240)">
    <!-- Pivot Perch -->
    <rect x="108" y="196" width="84" height="58" rx="12" fill="url(#cncBlack)" stroke="#52525b" stroke-width="2.5"/>
    <circle cx="144" cy="225" r="14" fill="#d4d4d8" stroke="#52525b" stroke-width="2"/>
    <circle cx="144" cy="225" r="6" fill="#18181b"/>
    <!-- 6-Click Red Adjuster Dial -->
    <rect x="192" y="188" width="42" height="22" rx="6" fill="url(#cncRed)" stroke="#7f1d1d" stroke-width="1.5"/>
    <circle cx="213" cy="199" r="4" fill="#fecaca"/>
    <!-- Blade -->
    <path d="M188 210 L465 204 C484 204 494 214 494 226 C494 238 484 248 465 248 L228 242 C204 242 188 238 188 232 Z" fill="url(#cncBlack)" stroke="#52525b" stroke-width="2.5"/>
    <!-- CNC Weight-Reduction Cutout -->
    <rect x="260" y="218" width="142" height="14" rx="7" fill="#dc2626" opacity="0.9"/>
    <rect x="266" y="221" width="130" height="8" rx="4" fill="#09090b"/>
    <!-- Ball End -->
    <circle cx="478" cy="226" r="16" fill="#27272a" stroke="#71717a" stroke-width="2"/>
  </g>

  <!-- Lower Lever (Clutch) -->
  <g transform="translate(0, 140) rotate(12 300 240)">
    <rect x="108" y="196" width="84" height="58" rx="12" fill="url(#cncBlack)" stroke="#52525b" stroke-width="2.5"/>
    <circle cx="144" cy="225" r="14" fill="#d4d4d8" stroke="#52525b" stroke-width="2"/>
    <circle cx="144" cy="225" r="6" fill="#18181b"/>
    <rect x="192" y="188" width="42" height="22" rx="6" fill="url(#cncRed)" stroke="#7f1d1d" stroke-width="1.5"/>
    <circle cx="213" cy="199" r="4" fill="#fecaca"/>
    <path d="M188 210 L465 204 C484 204 494 214 494 226 C494 238 484 248 465 248 L228 242 C204 242 188 238 188 232 Z" fill="url(#cncBlack)" stroke="#52525b" stroke-width="2.5"/>
    <rect x="260" y="218" width="142" height="14" rx="7" fill="#dc2626" opacity="0.9"/>
    <rect x="266" y="221" width="130" height="8" rx="4" fill="#09090b"/>
    <circle cx="478" cy="226" r="16" fill="#27272a" stroke="#71717a" stroke-width="2"/>
  </g>
</svg>
