<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="65%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#18181b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="beamWhite" x1="360" y1="245" x2="780" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="40%" stop-color="#e0f2fe" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamAmber" x1="360" y1="265" x2="780" y2="395" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.78"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bodyMetal" x1="160" y1="150" x2="360" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="45%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="lens1" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#93c5fd"/>
      <stop offset="80%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <radialGradient id="lens2" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="#09090b"/>
  <rect width="800" height="500" fill="url(#bgGlow)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Floor reflection line -->
  <ellipse cx="320" cy="405" rx="220" ry="18" fill="#000000" opacity="0.65"/>
  <line x1="60" y1="406" x2="740" y2="406" stroke="#27272a" stroke-width="1"/>

  <!-- High/Low Optical Light Beams -->
  <polygon points="365,205 790,70 790,265 365,255" fill="url(#beamWhite)"/>
  <polygon points="365,255 790,245 790,430 365,305" fill="url(#beamAmber)"/>
  <line x1="370" y1="255" x2="780" y2="255" stroke="#ffffff" stroke-opacity="0.22" stroke-dasharray="6 6"/>

  <!-- CNC Mounting Bracket -->
  <path d="M225 322 L210 388 L305 388 L292 322 Z" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
  <rect x="195" y="380" width="125" height="16" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <circle cx="222" cy="388" r="4" fill="#09090b"/>
  <circle cx="294" cy="388" r="4" fill="#09090b"/>

  <!-- Main CNC Aluminum Housing -->
  <rect x="145" y="168" width="215" height="168" rx="20" fill="url(#bodyMetal)" stroke="#52525b" stroke-width="2"/>

  <!-- Machined Heatsink Fins -->
  <g stroke="#3f3f46" stroke-width="4" stroke-linecap="round">
    <line x1="158" y1="192" x2="242" y2="192"/>
    <line x1="158" y1="210" x2="242" y2="210"/>
    <line x1="158" y1="228" x2="242" y2="228"/>
    <line x1="158" y1="246" x2="242" y2="246"/>
    <line x1="158" y1="264" x2="242" y2="264"/>
    <line x1="158" y1="282" x2="242" y2="282"/>
    <line x1="158" y1="300" x2="242" y2="300"/>
    <line x1="158" y1="316" x2="242" y2="316"/>
  </g>

  <!-- Racing Red Anodized Bezel Accent -->
  <rect x="260" y="176" width="108" height="152" rx="16" fill="#18181b" stroke="#dc2626" stroke-width="3"/>

  <!-- Dual Projector Lenses -->
  <circle cx="315" cy="218" r="32" fill="#09090b" stroke="#71717a" stroke-width="3"/>
  <circle cx="315" cy="218" r="24" fill="url(#lens1)"/>
  <circle cx="307" cy="210" r="6" fill="#ffffff" opacity="0.85"/>

  <circle cx="315" cy="288" r="32" fill="#09090b" stroke="#71717a" stroke-width="3"/>
  <circle cx="315" cy="288" r="24" fill="url(#lens2)"/>
  <circle cx="307" cy="280" r="6" fill="#ffffff" opacity="0.8"/>

  <!-- Braided Waterproof Cable -->
  <path d="M145 275 C 95 275, 90 340, 128 368 C 155 388, 175 390, 194 388" stroke="#27272a" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M145 275 C 95 275, 90 340, 128 368 C 155 388, 175 390, 194 388" stroke="#52525b" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round" fill="none"/>

  <!-- Subtle Technical Telemetry Callouts -->
  <g font-family="monospace" font-size="11" fill="#a1a1aa">
    <text x="530" y="106" fill="#e4e4e7" font-weight="bold">6000K HIGH BEAM</text>
    <text x="530" y="122">LASER CUTOFF OPTICS</text>
    <text x="530" y="370" fill="#fbbf24" font-weight="bold">3000K FOG / RAIN</text>
    <text x="530" y="386">DUAL-COLOR CHIPSET · IP67</text>
  </g>
</svg>
